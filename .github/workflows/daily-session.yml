name: Daily session (Codex)

# Runs Codex once a day during the race. Can also be started by hand (Actions tab,
# "Run workflow") for the dry run, or by n8n after the referee answers a request.
on:
  schedule:
    - cron: "17 7 * * *"  # 07:17 UTC every day (off the top of the hour, which GitHub delays)
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was started by hand (optional)"
        required: false
        default: "manual run"
      minutes:
        description: "Session length in minutes (default 55; use 15 for a test)"
        required: false
        default: "55"

permissions:
  contents: write

concurrency:
  group: race-session
  cancel-in-progress: false

env:
  AGENT: "Codex"
  RACE_START: "2026-11-06"
  RACE_END: "2026-12-20"
  SESSION_MINUTES: ${{ github.event.inputs.minutes || '55' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          TODAY=$(date -u +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [[ ! "$TODAY" < "$RACE_START" ]] && [[ ! "$TODAY" > "$RACE_END" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside race dates ($RACE_START to $RACE_END). Skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  session:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # the agent can't push; only the save step can

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare session
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          TODAY=$(date -u +%F)
          DAY=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$RACE_START" +%s) ) / 86400 + 1 ))
          [ "$DAY" -lt 1 ] && DAY="0 (dry run)"
          START=$(date -u +%H:%M)
          DEADLINE=$(date -u -d "+${SESSION_MINUTES} minutes" +%H:%M)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          sed -e "s/__DATE__/$TODAY/" -e "s/__DAY__/$DAY/" \
              -e "s/__START_TIME__/$START/" -e "s/__DEADLINE__/$DEADLINE/" \
              .github/race/run-prompt.md > /tmp/prompt.md
          if [[ "$DAY" == 0* ]]; then
            cat >> /tmp/prompt.md <<'DRYEOF'

          DRY RUN: this is a test of the setup, NOT the race. Do only the three steps below, then stop.
          Ignore the instructions above about choosing a business, STATE.md and the daily routine.
          1. Check which of these environment variables are set. Print only "set" or "missing", never the
             values: ANTHROPIC_API_KEY or OPENAI_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
             STRIPE_SECRET_KEY.
          2. Create site/index.html containing one line saying "dry run", and deploy it to your Cloudflare
             Pages project with wrangler, as described above.
          3. Add one line to JOURNAL.md saying what worked and what failed. Do not choose a business idea
             and do not edit STATE.md or BRIEF.md.
          DRYEOF
          fi
          # Keep trusted copies of the kit in case the agent edits .github/
          cp .github/race/secret-guard.sh /tmp/secret-guard.sh
          git config --global user.name "race-bot"
          git config --global user.email "race-bot@users.noreply.github.com"

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Run Codex
        continue-on-error: true
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          EXTRA_FLAGS: ${{ vars.AGENT_EXTRA_FLAGS }}
        run: |
          set +e
          timeout --signal=INT --kill-after=60s "${SESSION_MINUTES}m" \
            codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check $EXTRA_FLAGS "$(cat /tmp/prompt.md)"
          code=$?
          [ "$code" = "124" ] && echo "::warning::Session hit the ${SESSION_MINUTES}-minute limit."
          exit $code

      - name: Save the session
        if: always()
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Squash the day's work into one commit and throw away any edits to .github/
          git add -A
          git reset --soft "$START_SHA"
          git reset -q -- .github BRIEF.md REPLIES.md
          git checkout -q "$START_SHA" -- .github BRIEF.md REPLIES.md
          git clean -fdq -- .github
          if git diff --cached --quiet; then
            echo "Nothing changed today."
            exit 0
          fi
          git commit -q -m "Day $DAY session ($AGENT)"
          bash /tmp/secret-guard.sh "$START_SHA"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Lewis's replies may have landed in REPLIES.md during the session: rebase on top of them
          git fetch -q "$URL" main
          if ! git rebase FETCH_HEAD; then
            git rebase --abort
            git push "$URL" "HEAD:refs/heads/rescue-day-$DAY"
            echo "Rebase failed: today's work was saved to branch rescue-day-$DAY"
            exit 1
          fi
          git push "$URL" HEAD:main
